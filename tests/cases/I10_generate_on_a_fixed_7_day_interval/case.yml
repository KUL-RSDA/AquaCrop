id: I10_generate_on_a_fixed_7_day_interval
desc: >
  generate on a fixed 7-day interval.
  MaizeGDD.CRO on the Ottawa 2014 record, Ottawa.SOL, sown 2014-05-21;
  the only variable is IRR_gen_fixint.IRR.
tier: T1

stage:
  - Ottawa.CLI
  - Ottawa.Tnx
  - Ottawa.ETo
  - Ottawa.PLU
  - MaunaLoa.CO2
  - Ottawa.PPn
  - DEFAULT.CRO
  - DEFAULT.SOL
  - Ottawa.SOL
  - MaizeGDD.CRO
  - IRR_gen_fixint.IRR

project:
  name: I10
  desc: "I10 - generate on a fixed 7-day interval"
  runs:
    - year: 1
      sim: [2014-05-21, 2014-10-31]
      cli: Ottawa.CLI
      tnx: Ottawa.Tnx
      eto: Ottawa.ETo
      plu: Ottawa.PLU
      co2: MaunaLoa.CO2
      cro: MaizeGDD.CRO
      sol: Ottawa.SOL
      irr: IRR_gen_fixint.IRR

daily: [1]
particular: []
aggregate: 0
rtol: 1.0e-3
