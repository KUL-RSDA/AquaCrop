  - DEFAULT.SOL
  - MaizeSalinity.CRO
  - MaunaLoa.CO2
  - Ottawa.CLI
  - Ottawa.ETo
  - Ottawa.PLU
  - Ottawa.PPn
  - Ottawa.SOL
  - Ottawa.Tnx
  - SW0_ece8.SW0

project:
  name: L17b
  desc: "L17b - an extreme stomatal response to the salinity of the soil water"
  runs:
