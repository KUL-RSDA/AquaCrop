id: F05_1_50_m_ottawa_profile__0_30_m_unrepresented
desc: >
  1.50 m Ottawa profile, 0.30 m unrepresented.
  Soil Ottawa.SOL (1 horizon(s), 1.50 m),
  maize Zrmax 1.00 m, Ottawa 2014 season.
tier: T1

stage:
  - Ottawa.CLI
  - Ottawa.Tnx
  - Ottawa.ETo
  - Ottawa.PLU
  - MaunaLoa.CO2
  - Ottawa.PPn
  - DEFAULT.CRO
  - DEFAULT.SOL
  - MaizeGDD.CRO
  - Ottawa.SOL

project:
  name: F05
  desc: "F05 - 1.50 m Ottawa profile, 0.30 m unrepresented"
  runs:
    - year: 1
      sim: [2014-05-21, 2014-10-31]
      cli: Ottawa.CLI
      tnx: Ottawa.Tnx
      eto: Ottawa.ETo
      plu: Ottawa.PLU
      co2: MaunaLoa.CO2
      cro: MaizeGDD.CRO
      sol: Ottawa.SOL

patch:
  MaizeGDD.CRO:
    38: "     1.00      : Maximum effective rooting depth (m)"

