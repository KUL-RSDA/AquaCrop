id: C01_annual_maize_by_calendar_days
desc: >
  annual maize by calendar days.
  Crop MaizeCalwpy.CRO (calendar mode, Tbase 8.0 / Tupper 30.0 degC),
  climate Ottawa.Tnx, 2014-05-21 to 2014-10-31, GDD method 3.
tier: T1

stage:
  - Ottawa.CLI
  - Ottawa.ETo
  - Ottawa.PLU
  - MaunaLoa.CO2
  - Ottawa.PPn
  - DEFAULT.CRO
  - DEFAULT.SOL
  - Ottawa.SOL
  - MaizeCalwpy.CRO
  - Ottawa.Tnx

project:
  name: C01
  desc: "C01 - annual maize by calendar days"
  runs:
    - year: 1
      sim: [2014-05-21, 2014-10-31]
      cli: Ottawa.CLI
      tnx: Ottawa.Tnx
      eto: Ottawa.ETo
      plu: Ottawa.PLU
      co2: MaunaLoa.CO2
      cro: MaizeCalwpy.CRO
      sol: Ottawa.SOL

patch:
  Ottawa.PPn:
    21: "      3         : Default method for the calculation of growing degree days"

# Daily output 2 carries the GD column (run.f90:4124).
daily: [2]
particular: []
aggregate: 0

# Checked against runner/gdd_check.py, independently of the frozen reference.
expect_gdd:
  tnx: Ottawa.Tnx
  tbase: 8.0
  tupper: 30.0
  method: 3

predict:
  cycle_mode: calendar
  gdd_target: -9.0
  season_gdd_total: 1332.2
  matures_on: never within the window

rtol: 1.0e-3
