id: I21_generate_with_the_threshold_changing_mid_sea
desc: >
  generate with the threshold changing mid-season.
  MaizeGDD.CRO on the Ottawa 2014 record, Ottawa.SOL, sown 2014-05-21;
  the only variable is IRR_gen_multiperiod.IRR.
tier: T2

stage:
  - Ottawa.CLI
  - Ottawa.Tnx
  - Ottawa.ETo
  - Ottawa.PLU
  - MaunaLoa.CO2
  - Ottawa.PPn
  - DEFAULT.CRO
  - DEFAULT.SOL
  - Ottawa.SOL
  - MaizeGDD.CRO
  - IRR_gen_multiperiod.IRR

project:
  name: I21
  desc: "I21 - generate with the threshold changing mid-season"
  runs:
    - year: 1
      sim: [2014-05-21, 2014-10-31]
      cli: Ottawa.CLI
      tnx: Ottawa.Tnx
      eto: Ottawa.ETo
      plu: Ottawa.PLU
      co2: MaunaLoa.CO2
      cro: MaizeGDD.CRO
      sol: Ottawa.SOL
      irr: IRR_gen_multiperiod.IRR

daily: [1]
particular: []
aggregate: 0
rtol: 1.0e-3
