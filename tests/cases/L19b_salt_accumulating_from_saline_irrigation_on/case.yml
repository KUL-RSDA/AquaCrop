id: L19b_salt_accumulating_from_saline_irrigation_on
desc: >
  salt accumulating from saline irrigation on a clean profile.
  MaizeGDD.CRO on Ottawa.SOL, Ottawa 2014, sown 2014-05-21.
tier: T1

stage:
  - Ottawa.CLI
  - Ottawa.Tnx
  - Ottawa.ETo
  - Ottawa.PLU
  - MaunaLoa.CO2
  - Ottawa.PPn
  - DEFAULT.CRO
  - DEFAULT.SOL
  - Ottawa.SOL
  - MaizeGDD.CRO
  - IRR_gen_saline.IRR

project:
  name: L19b
  desc: "L19b - salt accumulating from saline irrigation on a clean profile"
  runs:
    - year: 1
      sim: [2014-05-21, 2014-10-31]
      cli: Ottawa.CLI
      tnx: Ottawa.Tnx
      eto: Ottawa.ETo
      plu: Ottawa.PLU
      co2: MaunaLoa.CO2
      cro: MaizeGDD.CRO
      sol: Ottawa.SOL
      irr: IRR_gen_saline.IRR

# outputs 4 and 6: root-zone salinity and per-compartment ECe
daily: [4, 6]
particular: []
aggregate: 0
rtol: 1.0e-3
