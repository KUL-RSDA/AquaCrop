id: F24_extreme_regrade__thickest_compartments
desc: >
  extreme regrade, thickest compartments.
  Soil Ottawa.SOL (1 horizon(s), 1.50 m),
  maize Zrmax 6.00 m, Ottawa 2014 season.
tier: T3

stage:
  - Ottawa.CLI
  - Ottawa.Tnx
  - Ottawa.ETo
  - Ottawa.PLU
  - MaunaLoa.CO2
  - Ottawa.PPn
  - DEFAULT.CRO
  - DEFAULT.SOL
  - MaizeGDD.CRO
  - Ottawa.SOL

project:
  name: F24
  desc: "F24 - extreme regrade, thickest compartments"
  runs:
    - year: 1
      sim: [2014-05-21, 2014-10-31]
      cli: Ottawa.CLI
      tnx: Ottawa.Tnx
      eto: Ottawa.ETo
      plu: Ottawa.PLU
      co2: MaunaLoa.CO2
      cro: MaizeGDD.CRO
      sol: Ottawa.SOL

patch:
  MaizeGDD.CRO:
    38: "     6.00      : Maximum effective rooting depth (m)"

# Out5CompWC writes one WC column per compartment, so the daily output is what
# makes the compartment arithmetic observable.
daily: [3, 5]
particular: []
aggregate: 0

# Predicted independently by tests/runner/soil_check.py, asserted by the runner.
expect_compartments: 12
predict:
  branch: "B4 no restrictive layer: adjust to Crop_RootMax | step4-regrade"
  total_depth: 6.0
  soil_rootmax: 6.0
  salt_cells: [2]
  thicknesses: [0.15, 0.20, 0.30, 0.35, 0.40, 0.45, 0.55, 0.60, 0.65, 0.70, 0.80, 0.85]

rtol: 1.0e-3
