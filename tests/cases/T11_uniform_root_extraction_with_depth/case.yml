stage:
  - DEFAULT.CRO
  - DEFAULT.SOL
  - MaizeGDD.CRO
  - MaunaLoa.CO2
  - Ottawa.CLI
  - Ottawa.ETo
  - Ottawa.PLU
  - Ottawa.PPn
  - Ottawa.SOL
  - Ottawa.Tnx

project:
  name: T11
  desc: "T11 - uniform root extraction with depth"
  runs:
    - year: 1
      sim: [2014-05-21, 2014-10-31]
      crop: [2014-05-21, 2014-10-31]
      cli: Ottawa.CLI
      tnx: Ottawa.Tnx
      eto: Ottawa.ETo
      plu: Ottawa.PLU
      co2: MaunaLoa.CO2
      cro: MaizeGDD.CRO
      sol: Ottawa.SOL

patch:
  MaizeGDD.CRO:
    40: "     0.015      : Maximum root water extraction (m3water/m3soil.day) in top quarter of root zone"
    41: "     0.015      : Maximum root water extraction (m3water/m3soil.day) in bottom quarter of root zone"

daily: [1, 2]
particular: []
aggregate: 0
rtol: 1.0e-3
