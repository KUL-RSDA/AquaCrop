id: X21_both_pollination_thresholds_binding
desc: >
  both pollination thresholds binding.
  MaizeGDD.CRO on Ottawa.SOL, Ottawa 2014, sown 2014-05-21.
tier: T2

stage:
  - Ottawa.CLI
  - Ottawa.Tnx
  - Ottawa.ETo
  - Ottawa.PLU
  - MaunaLoa.CO2
  - Ottawa.PPn
  - DEFAULT.CRO
  - DEFAULT.SOL
  - Ottawa.SOL
  - MaizeGDD.CRO

project:
  name: X21
  desc: "X21 - both pollination thresholds binding"
  runs:
    - year: 1
      sim: [2014-05-21, 2014-10-31]
      cli: Ottawa.CLI
      tnx: Ottawa.Tnx
      eto: Ottawa.ETo
      plu: Ottawa.PLU
      co2: MaunaLoa.CO2
      cro: MaizeGDD.CRO
      sol: Ottawa.SOL

patch:
  MaizeGDD.CRO:
    27: "        20      : Minimum air temperature below which pollination starts to fail (cold stress) (degC)"
    28: "        25      : Maximum air temperature above which pollination starts to fail (heat stress) (degC)"

# output 2 carries CC, CCw, the stress factors, biomass, HI and yield
daily: [2]
particular: []
aggregate: 0
rtol: 1.0e-3
