id: F40_penetrability_graded_100_50_25_0_over_four_h
desc: >
  penetrability graded 100/50/25/0 over four horizons.
  Soil PEN_graded.SOL (4 horizon(s), 1.50 m),
  maize Zrmax 3.00 m, Ottawa 2014 season.
tier: T1

stage:
  - Ottawa.CLI
  - Ottawa.Tnx
  - Ottawa.ETo
  - Ottawa.PLU
  - MaunaLoa.CO2
  - Ottawa.PPn
  - DEFAULT.CRO
  - DEFAULT.SOL
  - MaizeGDD.CRO
  - PEN_graded.SOL

project:
  name: F40
  desc: "F40 - penetrability graded 100/50/25/0 over four horizons"
  runs:
    - year: 1
      sim: [2014-05-21, 2014-10-31]
      cli: Ottawa.CLI
      tnx: Ottawa.Tnx
      eto: Ottawa.ETo
      plu: Ottawa.PLU
      co2: MaunaLoa.CO2
      cro: MaizeGDD.CRO
      sol: PEN_graded.SOL

patch:
  MaizeGDD.CRO:
    38: "     3.00      : Maximum effective rooting depth (m)"

# Out5CompWC writes one WC column per compartment, so the daily output is what
# makes the compartment arithmetic observable.
daily: [3, 5]
particular: []
aggregate: 0

# Predicted independently by tests/runner/soil_check.py, asserted by the runner.
expect_compartments: 12
predict:
  branch: "B6 restrictive, Soil_RootMax <= TotDepth: no adjustment"
  total_depth: 1.2
  soil_rootmax: 0.9
  salt_cells: [2]
  thicknesses: [0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10]

rtol: 1.0e-3
