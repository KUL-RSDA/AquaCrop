id: F07_profile_thinner_than_one_compartment
desc: >
  profile thinner than one compartment.
  Soil GEOM_0p05m.SOL (1 horizon(s), 0.05 m),
  maize Zrmax 0.05 m, Ottawa 2014 season.
tier: T3

stage:
  - Ottawa.CLI
  - Ottawa.Tnx
  - Ottawa.ETo
  - Ottawa.PLU
  - MaunaLoa.CO2
  - Ottawa.PPn
  - DEFAULT.CRO
  - DEFAULT.SOL
  - MaizeGDD.CRO
  - GEOM_0p05m.SOL

project:
  name: F07
  desc: "F07 - profile thinner than one compartment"
  runs:
    - year: 1
      sim: [2014-05-21, 2014-10-31]
      cli: Ottawa.CLI
      tnx: Ottawa.Tnx
      eto: Ottawa.ETo
      plu: Ottawa.PLU
      co2: MaunaLoa.CO2
      cro: MaizeGDD.CRO
      sol: GEOM_0p05m.SOL

patch:
  MaizeGDD.CRO:
    38: "     0.05      : Maximum effective rooting depth (m)"

# Out5CompWC writes one WC column per compartment, so the daily output is what
# makes the compartment arithmetic observable.
daily: [3, 5]
particular: []
aggregate: 0

# Predicted independently by tests/runner/soil_check.py, asserted by the runner.
expect_compartments: 1
predict:
  branch: "B3 Zrx <= TotDepth: no adjustment"
  total_depth: 0.05
  soil_rootmax: 0.05
  salt_cells: [2]
  thicknesses: [0.05]

rtol: 1.0e-3
