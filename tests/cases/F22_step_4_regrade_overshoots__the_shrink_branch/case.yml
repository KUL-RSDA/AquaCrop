id: F22_step_4_regrade_overshoots__the_shrink_branch
desc: >
  step-4 regrade OVERSHOOTS: the shrink branch.
  Soil Ottawa.SOL (1 horizon(s), 1.50 m),
  maize Zrmax 2.18 m, Ottawa 2014 season.
tier: T1

stage:
  - Ottawa.CLI
  - Ottawa.Tnx
  - Ottawa.ETo
  - Ottawa.PLU
  - MaunaLoa.CO2
  - Ottawa.PPn
  - DEFAULT.CRO
  - DEFAULT.SOL
  - MaizeGDD.CRO
  - Ottawa.SOL

project:
  name: F22
  desc: "F22 - step-4 regrade OVERSHOOTS: the shrink branch"
  runs:
    - year: 1
      sim: [2014-05-21, 2014-10-31]
      cli: Ottawa.CLI
      tnx: Ottawa.Tnx
      eto: Ottawa.ETo
      plu: Ottawa.PLU
      co2: MaunaLoa.CO2
      cro: MaizeGDD.CRO
      sol: Ottawa.SOL

patch:
  MaizeGDD.CRO:
    38: "     2.18      : Maximum effective rooting depth (m)"

# Out5CompWC writes one WC column per compartment, so the daily output is what
# makes the compartment arithmetic observable.
daily: [3, 5]
particular: []
aggregate: 0

# Predicted independently by tests/runner/soil_check.py, asserted by the runner.
expect_compartments: 12
predict:
  branch: "B4 no restrictive layer: adjust to Crop_RootMax | step4-regrade+shrink1"
  total_depth: 2.2
  soil_rootmax: 2.18
  salt_cells: [2]
  thicknesses: [0.10, 0.15, 0.15, 0.15, 0.15, 0.20, 0.20, 0.20, 0.20, 0.25, 0.25, 0.20]

rtol: 1.0e-3
