id: F17_step_3_caps_at_12__then_step_4_regrades
desc: >
  step 3 caps at 12, then step 4 regrades.
  Soil GEOM_0p30m.SOL (1 horizon(s), 0.30 m),
  maize Zrmax 1.30 m, Ottawa 2014 season.
tier: T1

stage:
  - Ottawa.CLI
  - Ottawa.Tnx
  - Ottawa.ETo
  - Ottawa.PLU
  - MaunaLoa.CO2
  - Ottawa.PPn
  - DEFAULT.CRO
  - DEFAULT.SOL
  - MaizeGDD.CRO
  - GEOM_0p30m.SOL

project:
  name: F17
  desc: "F17 - step 3 caps at 12, then step 4 regrades"
  runs:
    - year: 1
      sim: [2014-05-21, 2014-10-31]
      cli: Ottawa.CLI
      tnx: Ottawa.Tnx
      eto: Ottawa.ETo
      plu: Ottawa.PLU
      co2: MaunaLoa.CO2
      cro: MaizeGDD.CRO
      sol: GEOM_0p30m.SOL

patch:
  MaizeGDD.CRO:
    38: "     1.30      : Maximum effective rooting depth (m)"

# Out5CompWC writes one WC column per compartment, so the daily output is what
# makes the compartment arithmetic observable.
daily: [3, 5]
particular: []
aggregate: 0

# Predicted independently by tests/runner/soil_check.py, asserted by the runner.
expect_compartments: 12
predict:
  branch: "B4 no restrictive layer: adjust to Crop_RootMax | step3-extend step4-regrade+grow2"
  total_depth: 1.3
  soil_rootmax: 1.3
  salt_cells: [2]
  thicknesses: [0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.20]

rtol: 1.0e-3
