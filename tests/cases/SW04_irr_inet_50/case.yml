id: SW04_irr_inet_50
desc: >
  Sweep SW04: net irrigation requirement, IRR_inet_50.
tier: T2

stage:
  - Ottawa.CLI
  - MaunaLoa.CO2
  - Ottawa.PPn
  - DEFAULT.CRO
  - DEFAULT.SOL
  - MaizeGDD.CRO
  - Ottawa.SOL
  - Ottawa.Tnx
  - Ottawa.ETo
  - Ottawa.PLU
  - IRR_inet_50.IRR

project:
  name: SW04_irr_inet_50
  desc: "SW04 - net irrigation requirement, IRR_inet_50"
  runs:
    - year: 1
      sim: [2014-05-21, 2014-10-31]
      crop: [2014-05-21, 2014-10-31]
      cli: Ottawa.CLI
      tnx: Ottawa.Tnx
      eto: Ottawa.ETo
      plu: Ottawa.PLU
      co2: MaunaLoa.CO2
      cro: MaizeGDD.CRO
      sol: Ottawa.SOL
      irr: IRR_inet_50.IRR

# sweeps take season output only; the invariants still run on every one
daily: []
particular: []
aggregate: 0
# Inet reports a requirement, not applied water -- see O2.
skip_invariants: [surface_balance, daily_soil_balance,
                  daily_surface_balance]
rtol: 1.0e-3
