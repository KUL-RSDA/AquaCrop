id: F58_clay_over_sand__a_capillary_barrier
desc: >
  clay over sand: a capillary barrier.
  Soil FINE_OVER_COARSE.SOL (2 horizon(s), 1.50 m),
  maize Zrmax 1.00 m, Ottawa 2014 season.
tier: T1

stage:
  - Ottawa.CLI
  - Ottawa.Tnx
  - Ottawa.ETo
  - Ottawa.PLU
  - MaunaLoa.CO2
  - Ottawa.PPn
  - DEFAULT.CRO
  - DEFAULT.SOL
  - MaizeGDD.CRO
  - FINE_OVER_COARSE.SOL

project:
  name: F58
  desc: "F58 - clay over sand: a capillary barrier"
  runs:
    - year: 1
      sim: [2014-05-21, 2014-10-31]
      cli: Ottawa.CLI
      tnx: Ottawa.Tnx
      eto: Ottawa.ETo
      plu: Ottawa.PLU
      co2: MaunaLoa.CO2
      cro: MaizeGDD.CRO
      sol: FINE_OVER_COARSE.SOL

patch:
  MaizeGDD.CRO:
    38: "     1.00      : Maximum effective rooting depth (m)"

# Out5CompWC writes one WC column per compartment, so the daily output is what
# makes the compartment arithmetic observable.
daily: [3, 5]
particular: []
aggregate: 0

# Predicted independently by tests/runner/soil_check.py, asserted by the runner.
expect_compartments: 12
predict:
  branch: "B3 Zrx <= TotDepth: no adjustment"
  total_depth: 1.2
  soil_rootmax: 1.0
  salt_cells: [2, 6]
  thicknesses: [0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10]

rtol: 1.0e-3
