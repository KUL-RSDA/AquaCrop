id: F18_zrx_equals_the_tiled_depth__nothing_to_add
desc: >
  Zrx equals the tiled depth: nothing to add.
  Soil GEOM_0p60m.SOL (1 horizon(s), 0.60 m),
  maize Zrmax 0.60 m, Ottawa 2014 season.
tier: T2

stage:
  - Ottawa.CLI
  - Ottawa.Tnx
  - Ottawa.ETo
  - Ottawa.PLU
  - MaunaLoa.CO2
  - Ottawa.PPn
  - DEFAULT.CRO
  - DEFAULT.SOL
  - MaizeGDD.CRO
  - GEOM_0p60m.SOL

project:
  name: F18
  desc: "F18 - Zrx equals the tiled depth: nothing to add"
  runs:
    - year: 1
      sim: [2014-05-21, 2014-10-31]
      cli: Ottawa.CLI
      tnx: Ottawa.Tnx
      eto: Ottawa.ETo
      plu: Ottawa.PLU
      co2: MaunaLoa.CO2
      cro: MaizeGDD.CRO
      sol: GEOM_0p60m.SOL

patch:
  MaizeGDD.CRO:
    38: "     0.60      : Maximum effective rooting depth (m)"

# Out5CompWC writes one WC column per compartment, so the daily output is what
# makes the compartment arithmetic observable.
daily: [3, 5]
particular: []
aggregate: 0

# Predicted independently by tests/runner/soil_check.py, asserted by the runner.
expect_compartments: 6
predict:
  branch: "B3 Zrx <= TotDepth: no adjustment"
  total_depth: 0.6
  soil_rootmax: 0.6
  salt_cells: [2]
  thicknesses: [0.10, 0.10, 0.10, 0.10, 0.10, 0.10]

rtol: 1.0e-3
